name: depthfenc
description: "DepthFence — Geospatial Land Intelligence Platform (SIH26011 & SIH26012)"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.5

  # Backend
  supabase_flutter: ^2.17.2

  # Maps
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.4
  permission_handler: ^11.4.0

  # Local storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5

  # Camera
  camera: ^0.11.0+2

  # Reporting
  pdf: ^3.11.1
  printing: ^5.13.4

  # Charts
  fl_chart: ^0.69.0

  # Networking
  http: ^1.2.2

  # Share sheet (used by SurveyReportPngScreen)
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
